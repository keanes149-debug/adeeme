<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1114">
<title>Mi Panel Diario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, minimalista: se lee de un vistazo, cabe en una pantalla
   IDEA un tablero de testigos circulares, todos del mismo idioma visual
   PICTURE una cuadrícula de anillos; el del día apenas más grande, primero
   COLOUR blanco / casi negro, tinta neutra, rosa #ff2e7e solo para "ahora", semáforo para urgencia
   TYPE Space Grotesk (cifras) + Inter (texto)
   LAYOUT una línea de cabecera y debajo los anillos, que se escalan solos para caber sin desplazarse */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d1114);--ink:light-dark(#111518,#eef2f4);--mute:light-dark(#6b7479,#8b979d);
--line:light-dark(#e6eaec,#22292e);--track:light-dark(#eef1f3,#1b2226);--sheet:light-dark(#ffffff,#151b1f);
--accent:#ff2e7e;--green:light-dark(#18a35a,#34d27f);--yellow:light-dark(#e0a100,#ffc83d);--red:light-dark(#e2353a,#ff5d62);
--far:light-dark(#3a8fd0,#5cb2ea);--day:light-dark(#f2b632,#f5c451)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;
padding:max(14px,env(safe-area-inset-top,0px)) max(4vw,16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(4vw,16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1240px;width:100%;margin:0 auto}
.time{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;white-space:nowrap;line-height:1}
.date{color:var(--mute);font-size:14px;margin-top:3px;white-space:nowrap}
.hb{display:flex;gap:6px}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;min-height:38px}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{color:var(--red)}
#tiles{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;row-gap:clamp(10px,2vh,22px);column-gap:calc(var(--s,120px)*.2);
max-width:1240px;width:100%;margin:8px auto 0;overflow:auto;--s:120px}
.t{width:var(--s);display:flex;flex-direction:column;align-items:center;text-align:center;background:none;border:0;border-radius:16px;padding:4px 0;min-height:0;color:inherit}
.t:hover{background:none}.t:hover svg{transform:scale(1.03)}
.t svg{width:calc(var(--s)*.84);height:calc(var(--s)*.84);display:block;transition:transform .2s}
.t.big{width:calc(var(--s)*1.3)}
.t.big svg{width:calc(var(--s)*1.14);height:calc(var(--s)*1.14)}
.t .n{font-size:13px;font-weight:600;margin-top:4px;line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.t .d{font-size:13px;line-height:1.25;color:var(--mute);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t.add svg{opacity:.6}
.modal{position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(420px,100%);max-height:90vh;overflow:auto}
.sheet h2{font:600 20px/1.2 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.f input,.f select{width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.f.ck{display:flex;gap:8px;align-items:center}.f.ck input{width:auto}.f.ck span{margin:0;color:var(--ink)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.acts .sp{flex:1}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choices button{border-radius:12px;min-height:48px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row b{font-family:"Space Grotesk",sans-serif;white-space:nowrap}
.bigv{font:700 44px/1 "Space Grotesk",sans-serif;letter-spacing:-.02em;text-align:center;margin:6px 0 2px}
.cap{color:var(--mute);font-size:14px;text-align:center}
.step{display:flex;gap:10px;justify-content:center;margin-top:14px}
.step button{min-width:72px;min-height:48px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;z-index:20}
@media(prefers-reduced-motion:reduce){.t svg{transition:none}}
</style>
</head>
<body>
<header>
  <div><div class="time" id="now">--:--</div><div class="date" id="date"></div></div>
  <div class="hb"><button id="bSet">Ajustes</button></div>
</header>
<main id="tiles"></main>
<input type="file" id="fileIn" accept="application/json" hidden>
<div id="layer"></div>

<script>
{
const H=3600e3,DAY=24*H,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='mipanel.v1';
const at=(dd,h,m=0)=>{const d=new Date();d.setDate(d.getDate()+dd);d.setHours(h,m,0,0);return d.getTime()};

function seed(){const n=Date.now();return{
  settings:{name:'',start:6,end:18,cur:'$',budget:12000,budgetSpent:7830,budgetMonth:new Date().getMonth()},
  events:[{id:uid(),name:'Presentar proyecto',due:at(2,10)},{id:uid(),name:'Entrega de reporte',due:n+7*H},
    {id:uid(),name:'Pago de tarjeta',due:n+2.6*DAY},{id:uid(),name:'Cita médica',due:at(6,16,30)}],
  devices:[{id:'auto',name:'Laptop',kind:'laptop',auto:true,level:80,charging:false,at:n},
    {id:uid(),name:'Teléfono',kind:'phone',level:46,charging:false,at:n-40*60e3}],
  ais:[{id:uid(),name:'Claude',used:68,limit:100,unit:'%',reset:n+3.2*H,every:5},
    {id:uid(),name:'ChatGPT',used:22,limit:40,unit:'mensajes',reset:n+2.4*H,every:3},
    {id:uid(),name:'Cursor',used:310,limit:500,unit:'solicitudes',reset:at(12,0),every:0}],
  accounts:[{id:uid(),name:'Banco',bal:18400},{id:uid(),name:'Efectivo',bal:1250},{id:uid(),name:'Ahorro',bal:35000}],
  moves:[{t:n-3*H,amt:-180,note:'Comida'},{t:n-26*H,amt:-640,note:'Gasolina'},{t:n-50*H,amt:4500,note:'Pago freelance'}],
  meters:[{id:uid(),name:'Agua',val:5,max:8,unit:'vasos',step:1},{id:uid(),name:'Sueño',val:6.5,max:8,unit:'h',step:.5}],
  example:true}}

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.settings)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- formato ---------- */
const pad=n=>String(n).padStart(2,'0');
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const dur=ms=>{ms=Math.max(0,ms);const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/H),m=Math.floor(ms%H/60e3);
  return d?`${d}d ${h}h`:h?`${h}h ${pad(m)}m`:`${m}m`};
const ago=t=>{const m=Math.round((Date.now()-t)/60e3);return m<1?'ahora':m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`};
const money=v=>(v<0?'−':'')+S.settings.cur+Math.abs(v).toLocaleString('es-MX',{maximumFractionDigits:2});
const short=v=>Math.abs(v)>=1e6?S.settings.cur+(v/1e6).toFixed(1)+'M':Math.abs(v)>=1e4?S.settings.cur+(v/1e3).toFixed(1)+'k':money(v);
const fdate=t=>{const d=new Date(t),td=new Date();const same=(a,b)=>a.toDateString()===b.toDateString();
  const tm=new Date(td);tm.setDate(td.getDate()+1);
  return (same(d,td)?'hoy':same(d,tm)?'mañana':d.toLocaleDateString('es',{weekday:'short',day:'numeric'}))+' '+hm(d)};
const toLocal=t=>{const d=new Date(t);return new Date(d-d.getTimezoneOffset()*60e3).toISOString().slice(0,16)};
const hfmt=h=>pad(Math.floor(h))+':'+pad(Math.round((h%1)*60));
const level=(p,hi=.5,lo=.2)=>p>hi?'var(--green)':p>lo?'var(--yellow)':'var(--red)';

/* ---------- anillo base: todos usan el mismo ---------- */
const R=50,C=2*Math.PI*R;
function ring(frac,col,big,small,extra=''){
  frac=Math.max(0,Math.min(1,frac));
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--track)" stroke-width="8"/>
  ${extra}${frac>0?`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
   stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 60 60)"/>`:''}
  <text x="60" y="${small?62:68}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="600" letter-spacing="-.5" font-size="${big.length>6?19:big.length>4?22:26}" fill="var(--ink)">${esc(big)}</text>
  ${small?`<text x="60" y="80" text-anchor="middle" font-size="11" fill="var(--mute)">${esc(small)}</text>`:''}</svg>`}
const tile=(key,svg,name,sub,cls='')=>`<button class="t ${cls}" data-k="${key}" aria-label="${esc(name)}">${svg}<div class="n">${esc(name)}</div><div class="d">${esc(sub)}</div></button>`;

/* ---------- día (mismo anillo, mediodía arriba) ---------- */
function polar(h,r){const a=(h-12)/24*2*Math.PI;return[60+r*Math.sin(a),60-r*Math.cos(a)]}
function arc(h1,h2,r){if(h2<h1)h2+=24;if(h2-h1<.01)return'';const[x1,y1]=polar(h1,r),[x2,y2]=polar(h2,r);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${h2-h1>12?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`}
function dayTile(){
  const d=new Date(),h=d.getHours()+d.getMinutes()/60,{start,end}=S.settings;
  const inWin=start<end?(h>=start&&h<end):(h>=start||h<end),before=start<end&&h<start;
  let s=`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--track)" stroke-width="8"/>`;
  s+=`<path d="${arc(start,end,R)}" fill="none" stroke="var(--day)" stroke-width="8" opacity=".3"/>`;
  const live=inWin?arc(h,end,R):before?arc(start,end,R):'';
  if(live)s+=`<path d="${live}" fill="none" stroke="var(--day)" stroke-width="8" stroke-linecap="round"/>`;
  for(const q of [0,6,12,18]){const[x1,y1]=polar(q,R-7),[x2,y2]=polar(q,R-11);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--mute)" stroke-width="1.2"/>`}
  const t0=new Date(d).setHours(0,0,0,0);
  S.events.filter(e=>e.due>=t0&&e.due<t0+DAY).forEach(e=>{const[x,y]=polar((e.due-t0)/H,R);s+=`<circle cx="${x}" cy="${y}" r="3.6" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.5"/>`});
  const[nx,ny]=polar(h,R);s+=`<circle cx="${nx}" cy="${ny}" r="5.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
  const left=inWin?((end-h+24)%24)*H:((start-h+24)%24)*H;
  s+=`<text x="60" y="62" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="600" letter-spacing="-.5" font-size="19" fill="var(--ink)">${dur(left)}</text>
  <text x="60" y="78" text-anchor="middle" font-size="10" fill="var(--mute)">${inWin?'de jornada':'para empezar'}</text></svg>`;
  return tile('day',s,'Hoy',`quedan ${dur((24-h)*H)} del día`,'big')}

/* ---------- datos ---------- */
function evRing(e,now){
  const r=e.due-now;if(r<=0)return ring(0,'','Vencido');
  const days=r/DAY,idx=Math.ceil(days),frac=days-(idx-1);
  const col=idx>3?'var(--far)':idx===3?'var(--green)':idx===2?'var(--yellow)':'var(--red)';
  return ring(idx>3?1:frac,col,dur(r))}
function rollAi(){const n=Date.now();S.ais.forEach(a=>{if(a.reset&&a.reset<=n&&a.every>0){while(a.reset<=n)a.reset+=a.every*H;a.used=0;save()}})}
function rollBudget(){const st=S.settings,m=new Date().getMonth();if(st.budgetMonth!==m){st.budgetMonth=m;st.budgetSpent=0;save()}}

function render(){
  rollAi();rollBudget();
  const now=Date.now(),st=S.settings,out=[dayTile()];
  [...S.events].sort((a,b)=>a.due-b.due).forEach(e=>out.push(tile('ev:'+e.id,evRing(e,now),e.name,fdate(e.due))));
  S.devices.forEach(v=>out.push(tile('dev:'+v.id,ring(v.level/100,level(v.level/100,.4,.2),Math.round(v.level)+'%',v.charging?'cargando':'batería'),v.name,
    v.auto?(v.live?'en vivo':'sin lectura aquí'):ago(v.at))));
  S.ais.forEach(a=>{const free=1-Math.min(1,a.used/(a.limit||1)),pct=a.unit==='%';
    out.push(tile('ai:'+a.id,ring(free,level(free,.3,.1),pct?Math.round(free*100)+'%':String(Math.max(0,a.limit-a.used)),'libre'),a.name,
      a.reset?(a.reset>now?'reinicia '+dur(a.reset-now):'reinicio pendiente'):'sin reinicio'))});
  const total=S.accounts.reduce((s,a)=>s+(+a.bal||0),0),bf=st.budget?1-Math.min(1,st.budgetSpent/st.budget):1;
  if(S.accounts.length||st.budget)out.push(tile('money',ring(bf,st.budget?level(bf,.3,.1):'var(--far)',short(total),'total'),'Dinero',
    st.budget?money(Math.max(0,st.budget-st.budgetSpent))+' libres del mes':S.accounts.length+' cuentas'));
  S.meters.forEach(x=>{const p=x.val/(x.max||1);out.push(tile('met:'+x.id,ring(p,p>=1?'var(--green)':'var(--far)',x.val+'/'+x.max,x.unit),x.name,Math.round(p*100)+'%'))});
  out.push(tile('add',`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="4 6"/><path d="M60 46v28M46 60h28" stroke="var(--mute)" stroke-width="3" stroke-linecap="round"/></svg>`,'Agregar',S.example?'datos de ejemplo':'','add'));
  $('tiles').innerHTML=out.join('');
  const d=new Date();$('now').textContent=hm(d);
  $('date').textContent=(st.name?st.name+' · ':'')+d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  fit()}

/* ---------- que todo quepa en una pantalla ---------- */
let lastFit='';
function fit(){
  const box=$('tiles'),key=box.clientWidth+'x'+box.clientHeight+'x'+box.children.length;
  if(key===lastFit)return;lastFit=key;
  let lo=60,hi=Math.min(190,box.clientWidth/2.2);
  for(let i=0;i<9;i++){const m=(lo+hi)/2;box.style.setProperty('--s',m+'px');
    if(box.scrollHeight>box.clientHeight+1||box.scrollWidth>box.clientWidth+1)hi=m;else lo=m}
  box.style.setProperty('--s',Math.floor(lo)+'px')}
const ro=new ResizeObserver(()=>fit());ro.observe($('tiles'));

/* ---------- hojas y formularios ---------- */
const L=$('layer'),close=()=>L.innerHTML='';
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2200)}
function sheet(html,bind){L.innerHTML=`<div class="modal" id="mod"><div class="sheet">${html}</div></div>`;
  $('mod').onclick=e=>{if(e.target.id==='mod')close()};bind&&bind();const f=L.querySelector('input,select,button');f&&f.focus()}
const done=()=>{S.example=false;save();lastFit='';render()};
function form(title,fields,obj,onSave,onDel,extra=''){
  sheet(`<form id="frm"><h2>${esc(title)}</h2>
  ${fields.map(f=>f.type==='checkbox'?`<label class="f ck"><input type="checkbox" id="f_${f.k}" ${obj[f.k]?'checked':''}><span>${esc(f.label)}</span></label>`
   :f.type==='select'?`<label class="f"><span>${esc(f.label)}</span><select id="f_${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(obj[f.k])===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`
   :`<label class="f"><span>${esc(f.label)}</span><input id="f_${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="any" inputmode="decimal"':''} ${f.req?'required':''} value="${esc(f.type==='datetime-local'?(obj[f.k]?toLocal(obj[f.k]):''):obj[f.k]??'')}"></label>`).join('')}
  ${extra}<div class="acts">${onDel?'<button type="button" class="danger" id="fDel">Eliminar</button><span class="sp"></span>':''}<button type="button" id="fCan">Cancelar</button><button class="pri" type="submit">Guardar</button></div></form>`,()=>{
  $('fCan').onclick=close;
  if(onDel){let armed=false;$('fDel').onclick=()=>{if(!armed){armed=true;$('fDel').textContent='¿Seguro? Toca otra vez';return}onDel();close();done()}}
  $('frm').onsubmit=e=>{e.preventDefault();const o={...obj};
    for(const f of fields){const el=$('f_'+f.k);
      o[f.k]=f.type==='checkbox'?el.checked:f.type==='number'?(el.value===''?0:+el.value):f.type==='datetime-local'?(el.value?new Date(el.value).getTime():0):el.value.trim()}
    onSave(o);close();done()}})}
const upsert=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);i<0?arr.push(o):arr[i]=o};
const del=(arr,id)=>{const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)};

const F={
 ev:[{k:'name',label:'¿Qué tienes que hacer?',req:1},{k:'due',label:'Fecha y hora límite',type:'datetime-local',req:1}],
 dev:[{k:'name',label:'Nombre',req:1},{k:'level',label:'Nivel de batería (%)',type:'number'},{k:'charging',label:'Está cargando',type:'checkbox'}],
 ai:[{k:'name',label:'Nombre de la IA',req:1},{k:'unit',label:'Unidad',type:'select',opts:[['%','Porcentaje usado'],['mensajes','Mensajes'],['solicitudes','Solicitudes'],['tokens','Tokens'],['créditos','Créditos']]},{k:'used',label:'Usado',type:'number'},{k:'limit',label:'Límite (100 si es %)',type:'number'},{k:'reset',label:'Próximo reinicio',type:'datetime-local'},{k:'every',label:'Se reinicia cada (horas, 0 = no repetir)',type:'number'}],
 acc:[{k:'name',label:'Cuenta',req:1},{k:'bal',label:'Saldo',type:'number'}],
 met:[{k:'name',label:'Nombre',req:1},{k:'val',label:'Valor actual',type:'number'},{k:'max',label:'Meta',type:'number'},{k:'unit',label:'Unidad'},{k:'step',label:'Incremento de los botones',type:'number'}]};

const openEv=e=>form(e?'Editar evento':'Nuevo evento',F.ev,e||{id:uid(),name:'',due:at(3,10)},o=>upsert(S.events,o),e&&(()=>del(S.events,e.id)));
const openDev=v=>v&&v.auto&&v.live?toast('Esta batería se lee sola'):form(v?'Editar dispositivo':'Nuevo dispositivo',F.dev,v||{id:uid(),name:'',level:50,charging:false},
  o=>{o.level=Math.max(0,Math.min(100,o.level));o.at=Date.now();upsert(S.devices,o)},v&&!v.auto&&(()=>del(S.devices,v.id)));
const openAiForm=a=>form(a?'Editar IA':'Nueva IA',F.ai,a||{id:uid(),name:'',unit:'mensajes',used:0,limit:50,reset:Date.now()+5*H,every:5},o=>upsert(S.ais,o),a&&(()=>del(S.ais,a.id)));
const openAcc=a=>form(a?'Editar cuenta':'Nueva cuenta',F.acc,a||{id:uid(),name:'',bal:0},o=>upsert(S.accounts,o),a&&(()=>del(S.accounts,a.id)));
const openMetForm=x=>form(x?'Editar medidor':'Nuevo medidor',F.met,x||{id:uid(),name:'',val:0,max:8,unit:'',step:1},o=>{o.step=o.step||1;upsert(S.meters,o)},x&&(()=>del(S.meters,x.id)));

/* contador rápido para IA y medidores */
function stepper(title,get,cap,step,apply,edit){
  const draw=()=>{$('sv').textContent=get();$('sc').textContent=cap()};
  sheet(`<h2>${esc(title)}</h2><div class="bigv" id="sv"></div><div class="cap" id="sc"></div>
   <div class="step"><button id="sm">−${esc(step)}</button><button id="sp" class="pri">+${esc(step)}</button></div>
   <div class="acts"><button id="se">Editar</button><span class="sp"></span><button id="sx">Listo</button></div>`,()=>{
   draw();$('sm').onclick=()=>{apply(-1);save();draw()};$('sp').onclick=()=>{apply(1);save();draw()};
   $('se').onclick=edit;$('sx').onclick=()=>{close();done()}})}
const openAi=a=>stepper(a.name,()=>a.unit==='%'?Math.round(a.used)+'% usado':a.used+' / '+a.limit,
  ()=>(a.unit==='%'?Math.round(100-a.used)+'% libre':Math.max(0,a.limit-a.used)+' '+a.unit+' libres')+(a.reset?' · reinicia en '+dur(a.reset-Date.now()):''),1,
  d=>a.used=Math.max(0,+a.used+d),()=>openAiForm(a));
const openMet=x=>stepper(x.name,()=>x.val+' / '+x.max+' '+x.unit,()=>Math.round(x.val/(x.max||1)*100)+'% de la meta',x.step,
  d=>x.val=Math.max(0,Math.round((+x.val+d*x.step)*100)/100),()=>openMetForm(x));

function openMoney(){
  const st=S.settings,total=S.accounts.reduce((s,a)=>s+(+a.bal||0),0);
  const dl=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate()+1;
  sheet(`<h2>Dinero</h2><div class="bigv">${esc(money(total))}</div>
   <div class="cap">${st.budget?esc(money(Math.max(0,st.budget-st.budgetSpent)))+' libres de '+esc(money(st.budget))+' · ≈ '+esc(money(Math.max(0,(st.budget-st.budgetSpent)/dl)))+' por día':'sin presupuesto mensual'}</div>
   <div style="margin-top:14px">${S.accounts.map(a=>`<div class="row" data-acc="${a.id}"><span>${esc(a.name)}</span><b>${esc(money(+a.bal||0))}</b></div>`).join('')}</div>
   ${S.moves.length?`<div class="cap" style="text-align:left;margin-top:10px">Últimos movimientos</div>`+S.moves.slice(0,3).map(v=>`<div class="row" style="cursor:default"><span>${esc(v.note||(v.amt<0?'Gasto':'Ingreso'))} <span class="cap">· ${ago(v.t)}</span></span><b style="color:${v.amt<0?'var(--red)':'var(--green)'}">${v.amt<0?'':'+'}${esc(money(v.amt))}</b></div>`).join(''):''}
   <div class="acts"><button id="mAcc">+ Cuenta</button><span class="sp"></span><button id="mInc">+ Ingreso</button><button id="mExp" class="pri">− Gasto</button></div>`,()=>{
   L.querySelectorAll('[data-acc]').forEach(r=>r.onclick=()=>openAcc(S.accounts.find(a=>a.id===r.dataset.acc)));
   $('mAcc').onclick=()=>openAcc();$('mInc').onclick=()=>openMove(1);$('mExp').onclick=()=>openMove(-1)})}
function openMove(sign){
  if(!S.accounts.length)return openAcc();
  form(sign<0?'Registrar gasto':'Registrar ingreso',[{k:'amt',label:'Monto',type:'number',req:1},{k:'acc',label:'Cuenta',type:'select',opts:S.accounts.map(a=>[a.id,a.name])},{k:'note',label:'Concepto'}],
   {amt:'',acc:S.accounts[0].id,note:''},o=>{const a=S.accounts.find(x=>x.id===o.acc),v=Math.abs(o.amt)*sign;if(!a||!v)return;
    a.bal=(+a.bal||0)+v;if(sign<0)S.settings.budgetSpent+=Math.abs(v);S.moves.unshift({t:Date.now(),amt:v,note:o.note});S.moves=S.moves.slice(0,30)})}

function openAdd(){
  sheet(`<h2>Agregar</h2><div class="choices"><button data-a="ev">Fecha límite</button><button data-a="ai">Límite de IA</button>
   <button data-a="dev">Batería</button><button data-a="met">Medidor</button><button data-a="exp">Gasto</button><button data-a="acc">Cuenta de dinero</button></div>
   <div class="acts"><button id="aX">Cerrar</button></div>`,()=>{$('aX').onclick=close;
   L.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>({ev:openEv,ai:openAiForm,dev:openDev,met:openMetForm,exp:()=>openMove(-1),acc:openAcc})[b.dataset.a]())})}
function openSettings(){
  form('Ajustes',[{k:'name',label:'Tu nombre'},{k:'start',label:'Inicio de jornada (hora, ej. 6)',type:'number'},{k:'end',label:'Fin de jornada (hora, ej. 18)',type:'number'},
   {k:'cur',label:'Símbolo de moneda'},{k:'budget',label:'Presupuesto mensual (0 = sin presupuesto)',type:'number'},{k:'budgetSpent',label:'Gastado este mes',type:'number'},{k:'reset',label:'Borrar todo y empezar vacío',type:'checkbox'}],
   {...S.settings,reset:false},o=>{if(o.reset){const b=seed();S={settings:{...b.settings,name:o.name,budget:0,budgetSpent:0},events:[],devices:[b.devices[0]],ais:[],accounts:[],moves:[],meters:[]};hookBattery();return}
    delete o.reset;o.start=((o.start%24)+24)%24;o.end=((o.end%24)+24)%24;o.cur=o.cur||'$';S.settings=o},null,
   `<div class="acts" style="justify-content:flex-start;margin:0 0 4px"><button type="button" id="bExp">Exportar copia</button><button type="button" id="bImp">Importar copia</button></div>`);
  $('bExp').onclick=()=>{try{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='mi-panel-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();toast('Copia descargada')}catch(e){toast('No se pudo exportar aquí')}};
  $('bImp').onclick=()=>$('fileIn').click()}

/* ---------- batería en vivo ---------- */
async function hookBattery(){
  const dev=S.devices.find(v=>v.auto);if(!dev||!navigator.getBattery)return;
  try{const b=await navigator.getBattery();
    const up=()=>{dev.level=b.level*100;dev.charging=b.charging;dev.live=true;dev.at=Date.now();render()};
    up();b.addEventListener('levelchange',up);b.addEventListener('chargingchange',up)}catch(e){}}

/* ---------- interacción ---------- */
$('tiles').addEventListener('click',e=>{const t=e.target.closest('[data-k]');if(!t)return;const[k,id]=t.dataset.k.split(':'),find=a=>a.find(x=>x.id===id);
  ({day:openSettings,add:openAdd,money:openMoney,ev:()=>openEv(find(S.events)),dev:()=>openDev(find(S.devices)),ai:()=>openAi(find(S.ais)),met:()=>openMet(find(S.meters))})[k]()});
$('bSet').onclick=openSettings;
$('fileIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.settings)throw 0;S=o;close();save();lastFit='';render();hookBattery();toast('Datos importados')}catch(x){toast('Archivo no válido')}e.target.value=''};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

render();hookBattery();
setInterval(render,20000);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host))try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
